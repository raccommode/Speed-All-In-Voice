name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.11'
      - run: uv python install 3.12
      # Mock model contracts in CI; hardware benchmarks are published separately.
      - run: uv venv --python 3.12
      - run: uv pip install --no-deps -e .
      - run: uv pip install fastapi==0.162.0 httpx==0.28.1 numpy==2.5.4 uvicorn==0.54.0 pytest==9.2.0 pytest-asyncio==1.4.1.post1 ruff==0.17.4
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check .
