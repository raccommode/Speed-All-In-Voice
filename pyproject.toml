[project]
name = "speed-all-in-voice"
version = "0.1.0"
description = "Local, interruptible voice conversations for Ollama and AI agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["fastapi==0.162.0", "uvicorn[standard]==0.54.0", "httpx==0.28.1", "numpy==2.5.4", "soundfile==0.14.0", "pocket-tts==4.0.1", "silero-vad==6.2.3", "onnxruntime==1.31.1"]
[project.optional-dependencies]
mac = ["mlx-whisper==0.4.3"]
cuda = ["faster-whisper==1.2.1"]
[dependency-groups]
benchmark = ["scipy==1.18.1"]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.4"]
[project.scripts]
speed-voice = "speed_voice.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/speed_voice"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
