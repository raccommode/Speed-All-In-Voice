<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speed All in Voice</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#101512;color:#e6efe8}body{max-width:760px;margin:8vh auto;padding:24px}h1{font-size:44px;letter-spacing:-2px}p{line-height:1.6;color:#b9cbbf}button,input{font:inherit;padding:12px;border:1px solid #45614f;border-radius:8px;background:#18291e;color:inherit}button{cursor:pointer}button:disabled{opacity:.4}#log{white-space:pre-wrap;line-height:1.6;margin-top:24px;border-top:1px solid #45614f;padding-top:20px}#status{color:#89e8a9}.row{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap}#text{flex:1}small{color:#a6b5aa}
</style>
<h1>Speed All in Voice</h1><p>A local voice connection to your agent. Use headphones for reliable interruptions. Your microphone is active only after you press Start.</p>
<div class="row"><input id="token" type="password" placeholder="Server token (if configured)" aria-label="Server token"><button id="start">Start conversation</button><button id="stop" disabled>Stop</button></div>
<div id="status" role="status">Disconnected</div>
<form id="form" class="row"><input id="text" placeholder="Or type a message" aria-label="Message" maxlength="4000"><button id="send" disabled>Send</button></form>
<small>Local microphone → speech recognition → Ollama → streaming speech</small><div id="log" role="log"></div>
<script>
const $ = id => document.getElementById(id);
let ws, ctx, stream, capture, source, nextTime=0, active=new Set(), ignored=new Set(), turnStart=0, first=true;
function flush(){for(const node of active){try{node.stop()}catch{}}active.clear();nextTime=ctx?.currentTime||0;}
async function stop(){flush();stream?.getTracks().forEach(t=>t.stop());capture?.disconnect();source?.disconnect();if(ws){ws.onclose=null;ws.close()}const closing=ctx;ctx=null;await closing?.close();$('start').disabled=false;$('stop').disabled=true;$('send').disabled=true;$('status').textContent='Disconnected';}
$('stop').onclick=stop;
$('start').onclick=async()=>{
  $('start').disabled=true;
  try{
    ignored.clear();ctx=new AudioContext();await ctx.resume();
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    await ctx.audioWorklet.addModule('/capture.js');
    capture=new AudioWorkletNode(ctx,'capture');source=ctx.createMediaStreamSource(stream);source.connect(capture);
    const mute=ctx.createGain();mute.gain.value=0;capture.connect(mute).connect(ctx.destination);
    ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/v1/conversation`);
    ws.onopen=()=>ws.send(JSON.stringify({type:'hello',token:$('token').value}));
    capture.port.onmessage=e=>{if(ws.readyState===1&&$('send').disabled===false){if(ws.bufferedAmount>64000){stop();return}ws.send(e.data)}};
    ws.onmessage=e=>{
      const m=JSON.parse(e.data);
      if(m.type==='ready'){$('status').textContent='Listening';$('stop').disabled=false;$('send').disabled=false;}
      if(m.type==='speech_started'){flush();$('status').textContent='Listening';}
      if(m.type==='interrupted'){ignored.add(m.turn_id);flush();}
      if(ignored.has(m.turn_id))return;
      if(m.type==='transcript'){$('log').textContent+=`\nYou: ${m.text}\nAssistant: `;turnStart=performance.now();first=true;}
      if(m.type==='text')$('log').textContent+=m.text;
      if(m.type==='audio'){
        const bytes=Uint8Array.from(atob(m.pcm),c=>c.charCodeAt(0));const view=new DataView(bytes.buffer);
        const buffer=ctx.createBuffer(1,bytes.length/2,m.sample_rate);const data=buffer.getChannelData(0);
        for(let i=0;i<data.length;i++)data[i]=view.getInt16(i*2,true)/32768;
        const node=ctx.createBufferSource();node.buffer=buffer;node.connect(ctx.destination);
        const when=Math.max(ctx.currentTime+.02,nextTime);node.start(when);nextTime=when+buffer.duration;active.add(node);node.onended=()=>active.delete(node);
        if(first){first=false;$('status').textContent=`Speaking · first audio scheduled ${Math.round(performance.now()-turnStart)} ms after transcript`;}
      }
      if(m.type==='done')$('log').textContent+=`\n[Server first audio: ${Math.round(m.metrics.first_audio_ms||0)} ms from committed turn]\n`;
      if(m.type==='error'){$('status').textContent=m.message;}
    };
    ws.onclose=()=>{if(ctx)stop()};
  }catch(e){await stop();$('status').textContent=e.message;}
};
$('form').onsubmit=e=>{e.preventDefault();const text=$('text').value.trim();if(text&&ws?.readyState===1){flush();ws.send(JSON.stringify({type:'text',text}));$('text').value=''}};
</script></html>
